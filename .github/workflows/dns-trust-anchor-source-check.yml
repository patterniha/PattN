name: Verify IANA DNS root trust anchors

on:
  pull_request:
    paths:
      - '.github/trust/icann-root-ca-bundle.pem'
      - '.github/workflows/dns-trust-anchor-source-check.yml'
      - 'pattn-discovery/cmd/dns-trust-anchor-*/**'
      - 'pattn-discovery/internal/dnssec/**'
  workflow_dispatch:
  schedule:
    - cron: '17 6 1,15 * *'
    # Daily around the October rollover window. The local audit intentionally
    # fails after 2026-10-11 until a post-rollover review updates VerifiedDate.
    - cron: '17 6 10-20 10 *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: './pattn-discovery/go.mod'
        cache: false

    - name: Verify IANA detached CMS signature
      shell: bash
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/iana-root-anchors"
        mkdir -p "$work"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://data.iana.org/root-anchors/root-anchors.xml -o "$work/root-anchors.xml"
        curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://data.iana.org/root-anchors/root-anchors.p7s -o "$work/root-anchors.p7s"
        cp .github/trust/icann-root-ca-bundle.pem "$work/icannbundle.pem"
        openssl verify -CAfile "$work/icannbundle.pem" "$work/icannbundle.pem"
        # IANA publishes root-anchors.p7s as a detached S/MIME signature.
        # Use the same verification mode as IANA's get-trust-anchor reference tooling.
        openssl smime -verify -inform DER -in "$work/root-anchors.p7s" -content "$work/root-anchors.xml" -CAfile "$work/icannbundle.pem" -out /dev/null
        {
          echo "run_id=$GITHUB_RUN_ID"
          echo "commit=$GITHUB_SHA"
          echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha256sum "$work/root-anchors.xml" "$work/root-anchors.p7s" "$work/icannbundle.pem"
        } | tee "$work/source-evidence.txt"

    - name: Compare embedded snapshot with the CMS-verified IANA source
      working-directory: ./pattn-discovery
      run: go run ./cmd/dns-trust-anchor-source-check -source-file "$RUNNER_TEMP/iana-root-anchors/root-anchors.xml"

    - name: Audit local rollover/freshness policy
      working-directory: ./pattn-discovery
      run: go run ./cmd/dns-trust-anchor-audit -max-age-days 90

    - name: Retain exact IANA rollover evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: iana-root-anchor-source-${{ github.run_id }}
        path: ${{ runner.temp }}/iana-root-anchors/
        if-no-files-found: error
        retention-days: 90
