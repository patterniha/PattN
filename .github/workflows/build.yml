name: build

on:
  workflow_call:
    inputs:
      target: # windows linux macos
        required: true
        type: string
      project:
        required: false
        type: string
        default: './v2rayN.Desktop/v2rayN.Desktop.csproj'
      version: # PattN: release tag used as the app version (x.y.z-P<n>); empty keeps Directory.Build.props
        required: false
        type: string
        default: ''

jobs:
  build:
    name: build x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: |-
      ${{
        case(
          inputs.target == 'macos', 'macos-latest',
          inputs.target == 'linux', 'ubuntu-24.04',
          inputs.target == 'windows', 'windows-latest',
          'ubuntu-latest'
        )
      }}
    env:
      Output: "${{ github.workspace }}/${{ matrix.arch }}"
      RID: |-
        ${{
          case(
            inputs.target == 'macos', format('osx-{0}', matrix.arch),
            inputs.target == 'windows', format('win-{0}', matrix.arch),
            format('{0}-{1}', inputs.target, matrix.arch)
          )
        }}
      Project: ${{ inputs.project }}
      Version: ${{ inputs.version }}
      ExtOpt: |-
        ${{
          case(
            inputs.target == 'windows', '-p:EnableWindowsTargeting=true',
            ''
          )
        }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Purge SDKs
      shell: pwsh
      run: |
        echo "Before:"
        dotnet --list-sdks
        
        dotnet --list-sdks | % {
          $_ -match '^\S+\s+\[(.+)\]$' > $null
          $d = Join-Path $Matches[1] $_.Split()[0]
          Write-Host "Removing $d"
          if ($IsWindows) { rm $d -r -fo } else { sudo rm -rf "$d" }
        }
        
        echo "After:"
        dotnet --list-sdks 2>$null; $LASTEXITCODE=0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.1xx
        
    - name: Check version
      if: inputs.version != ''
      shell: bash
      run: |
        [[ "$Version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-P[0-9]+)?$ ]] || { echo "::error::release_tag must be x.y.z-P<n> (got '$Version')"; exit 1; }
        Base="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' v2rayN/Directory.Build.props | head -n 1)"
        [[ "${Version%%-P*}" == "$Base" ]] || { echo "::error::release_tag '$Version' must be based on upstream version $Base (Directory.Build.props), e.g. $Base-P1"; exit 1; }

    - name: Build v2rayN
      shell: bash
      working-directory: ./v2rayN
      run: |
        set -euo pipefail
        publish_args=(-c Release -r "$RID" -p:SelfContained=true)
        if [[ -n "$ExtOpt" ]]; then
          read -r -a ext_args <<< "$ExtOpt"
          publish_args+=("${ext_args[@]}")
        fi
        if [[ -n "$Version" ]]; then
          publish_args+=("-p:Version=$Version")
        fi
        publish_args+=(-o "$Output")
        dotnet publish "$Project" "${publish_args[@]}"

    - name: Build AmazTool
      shell: bash
      working-directory: ./v2rayN
      run: |
        set -euo pipefail
        publish_args=(-c Release -r "$RID" -p:SelfContained=true -p:PublishTrimmed=true)
        if [[ -n "$ExtOpt" ]]; then
          read -r -a ext_args <<< "$ExtOpt"
          publish_args+=("${ext_args[@]}")
        fi
        if [[ -n "$Version" ]]; then
          publish_args+=("-p:Version=$Version")
        fi
        publish_args+=(-o "$Output")
        dotnet publish ./AmazTool/AmazTool.csproj "${publish_args[@]}"

    - name: Remove Debug Symbols
      shell: bash
      run: |
        find ${{ matrix.arch }} -type f -name '*.pdb' -delete

    - name: Validate macOS publish artifact
      if: inputs.target == 'macos'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ matrix.arch }}" in
          x64) expected_arch=x86_64 ;;
          arm64) expected_arch=arm64 ;;
          *) echo "::error::unsupported macOS matrix architecture: ${{ matrix.arch }}"; exit 1 ;;
        esac

        main_executable="${{ github.workspace }}/${{ matrix.arch }}/PattN"
        amaz_tool="${{ github.workspace }}/${{ matrix.arch }}/AmazTool"
        check_macos_binary() {
          local binary="$1"
          local label="$2"
          local dependency
          local rpath

          if [[ ! -f "$binary" || -L "$binary" || ! -x "$binary" ]]; then
            echo "::error::$label is not a real executable: $binary"
            exit 1
          fi
          if [[ "$(lipo -archs "$binary")" != "$expected_arch" ]]; then
            echo "::error::$label has the wrong architecture: $(lipo -archs "$binary") (expected $expected_arch)"
            exit 1
          fi

          dependency="$(otool -L "$binary" | awk '
            NR > 1 && $1 ~ /^\// &&
            $1 !~ /^\/System\/Library\// &&
            $1 !~ /^\/usr\/lib\// { print $1; exit }
          ')"
          if [[ -n "$dependency" ]]; then
            echo "::error::$label has a non-system absolute dependency: $dependency"
            exit 1
          fi

          rpath="$(otool -l "$binary" | awk '
            $1 == "path" && $2 ~ /^\// &&
            $2 !~ /^\/System\/Library\// &&
            $2 !~ /^\/usr\/lib\// { print $2; exit }
          ')"
          if [[ -n "$rpath" ]]; then
            echo "::error::$label has a non-system absolute rpath: $rpath"
            exit 1
          fi
        }

        check_macos_binary "$main_executable" PattN
        check_macos_binary "$amaz_tool" AmazTool

        for icon in \
          "${{ github.workspace }}/${{ matrix.arch }}/v2rayN.icns" \
          "${{ github.workspace }}/${{ matrix.arch }}/v2rayN.png"; do
          if [[ ! -f "$icon" || -L "$icon" ]]; then
            echo "::error::missing real macOS asset: $icon"
            exit 1
          fi
        done

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.arch }}
        path: ${{ matrix.arch }}
