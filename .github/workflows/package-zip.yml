name: package and release Zip

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target: # windows linux macos windows-desktop
        required: true
        type: string
      isAot:
        required: false
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  package:
    name: package x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ubuntu-latest
    env:
      Target: |- 
        ${{
          case(
            inputs.target == 'windows-desktop', 'windows',
            inputs.target
          )
        }}
      Arch: |-
        ${{
          case(
            matrix.arch == 'x64', '64',
            matrix.arch
          ) 
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set package variables
      id: package-vars
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_IS_AOT: ${{ inputs.isAot }}
      run: |
        set -euo pipefail
        package_dir="PattN-${Target}-${Arch}"
        package_file="${package_dir}.zip"
        build_artifact_name="${{ matrix.arch }}"
        rename_suffix=""
        if [[ "$INPUT_IS_AOT" == "true" ]]; then
          build_artifact_name="${build_artifact_name}-aot"
          rename_suffix="-aot"
        fi
        if [[ "$INPUT_TARGET" == "windows-desktop" ]]; then
          rename_suffix="-desktop${rename_suffix}"
        fi
        final_package_file="${package_dir}${rename_suffix}.zip"

        {
          echo "build_artifact_name=${build_artifact_name}"
          echo "package_dir=${package_dir}"
          echo "package_file=${package_file}"
          echo "final_package_file=${final_package_file}"
          echo "rename_suffix=${rename_suffix}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.package-vars.outputs.build_artifact_name }}
        path: ${{ steps.package-vars.outputs.package_dir }}

    - name: Get v2rayN-core-bin
      run: |
        wget -nv -O core-bin.zip "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-$Target-$Arch.zip"
        7z x -y core-bin.zip
        cp -an v2rayN-$Target-$Arch/. PattN-$Target-$Arch/

    - name: Bundle patterniha/Xray-core
      run: |
        set -euo pipefail
        case "$Target-$Arch" in
          windows-64)    asset=Xray-windows-64.zip ;;
          windows-arm64) asset=Xray-windows-arm64-v8a.zip ;;
          linux-64)      asset=Xray-linux-64.zip ;;
          linux-arm64)   asset=Xray-linux-arm64-v8a.zip ;;
          macos-64)      asset=Xray-macos-64.zip ;;
          macos-arm64)   asset=Xray-macos-arm64-v8a.zip ;;
          *) echo "::error::no Xray asset mapping for $Target-$Arch"; exit 1 ;;
        esac
        wget -nv -O xray-core.zip "https://github.com/patterniha/Xray-core/releases/latest/download/$asset"
        7z x -y -oxray-core xray-core.zip
        mkdir -p PattN-$Target-$Arch/bin/xray
        cp -f xray-core/xray* PattN-$Target-$Arch/bin/xray/
        chmod +x PattN-$Target-$Arch/bin/xray/xray 2>/dev/null || true

    # The Aether core (windows-arm64 gets the x64 one) with its license notice in bin/aether, and Psiphon's signed
    # server list in bin; a failed checksum or signature check fails the job (package-aether.sh)
    - name: Bundle patterniha/Aether and Psiphon's server list
      run: |
        bash package-aether.sh "$Target-$Arch" "PattN-$Target-$Arch/bin"

    - name: Bundle Chocolate4U geo files
      run: |
        set -euo pipefail
        wget -nv -O "PattN-$Target-$Arch/bin/geosite.dat" "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat"
        wget -nv -O "PattN-$Target-$Arch/bin/geoip.dat" "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat"
        mkdir -p "PattN-$Target-$Arch/bin/srss"
        wget -nv -O "PattN-$Target-$Arch/bin/srss/geosite-category-ir.srs" "https://raw.githubusercontent.com/chocolate4u/Iran-sing-box-rules/rule-set/geosite-category-ir.srs"
        wget -nv -O "PattN-$Target-$Arch/bin/srss/geoip-ir.srs" "https://raw.githubusercontent.com/chocolate4u/Iran-sing-box-rules/rule-set/geoip-ir.srs"

    - name: Package zip archive
      shell: bash
      run: |
        7z a -tZip "${{ steps.package-vars.outputs.package_file }}" "${{ steps.package-vars.outputs.package_dir }}" -mx1

    - name: Rename package archive
      if: steps.package-vars.outputs.rename_suffix != ''
      shell: bash
      run: |
        mv "${{ steps.package-vars.outputs.package_file }}" \
          "${{ steps.package-vars.outputs.package_dir }}${{ steps.package-vars.outputs.rename_suffix }}.zip"

    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.target }}-${{ matrix.arch }}${{ inputs.isAot && '-aot' || '' }}
        path: ${{ steps.package-vars.outputs.final_package_file }}
        if-no-files-found: error

  release:
    name: sign and upload zip x64 arm64
    needs: package
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-${{ inputs.target }}-${{ matrix.arch }}${{ inputs.isAot && '-aot' || '' }}
      file_pattern: '*.zip'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
